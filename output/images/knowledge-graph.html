const COLORS = {"source-summary": "#4a90d9", "source": "#4a90d9", "concept": "#2ecc71", "entity": "#e67e22", "comparison": "#9b59b6", "meta": "#95a5a6"};
const graph = {"nodes": [{"id": "Queries", "title": "Dataview Queries", "type": "reference", "summary": "", "connections": 1}, {"id": "Dashboard", "title": "Dashboard", "type": "dashboard", "summary": "", "connections": 14}, {"id": "Tags", "title": "Tag Index", "type": "reference", "summary": "", "connections": 1}, {"id": "Graph", "title": "Graph Analysis", "type": "reference", "summary": "", "connections": 32}, {"id": "concepts/temporal-knowledge", "title": "Temporal Knowledge", "type": "concept", "summary": "Graphiti's core contribution: representing knowledge with temporal validity windows (when a fact became true and when it was superseded) rather than treating facts as eternally true or false \u2014 critical for AI agents in dynamic environments.", "connections": 6}, {"id": "concepts/obsidian-as-ide", "title": "Obsidian as IDE", "type": "concept", "summary": "Using Obsidian as a read-only frontend IDE to view LLM-maintained wikis, raw sources, and generated visualizations \u2014 with the LLM as the actual author.", "connections": 11}, {"id": "concepts/multi-agent-systems", "title": "Multi-Agent Systems for Knowledge Management", "type": "concept", "summary": "Using networks of specialized LLM agents (rather than a single LLM) to build and maintain knowledge systems \u2014 exemplified by KARMA's 9-agent KG enrichment pipeline and STORM's perspective-simulating article creation system.", "connections": 11}, {"id": "concepts/hallucination-contamination", "title": "Hallucination Contamination", "type": "concept", "summary": "The risk that LLM-generated errors written into a wiki propagate into future queries and fine-tuning, corrupting the knowledge base over time.", "connections": 15}, {"id": "concepts/rag-vs-index-based-retrieval", "title": "RAG vs. Index-Based Retrieval", "type": "concept", "summary": "At small-to-medium scale (~100 articles, ~400K words), LLM-maintained index files and one-line summaries can replace vector database RAG for document Q&A.", "connections": 16}, {"id": "concepts/linting-and-health-checks", "title": "Linting and Health Checks", "type": "concept", "summary": "LLM-driven health checks over the compiled wiki to find inconsistencies, fill data gaps, detect broken links, identify orphan articles, and suggest new content.", "connections": 12}, {"id": "concepts/vault-separation", "title": "Vault Separation", "type": "concept", "summary": "Steph Ango's (Obsidian CEO) recommendation to maintain a clean human-curated Obsidian vault separately from agent-generated content, preventing hallucination contamination of personal knowledge.", "connections": 7}, {"id": "concepts/data-quality-bottleneck", "title": "Data Quality Bottleneck", "type": "concept", "summary": "In LLM knowledge base pipelines, data quality at the raw input stage \u2014 not model capability \u2014 is the decisive factor: low-quality ingestion cascades into contaminated wiki content and flawed fine-tuning.", "connections": 11}, {"id": "concepts/personal-knowledge-management", "title": "Personal Knowledge Management (PKM)", "type": "concept", "summary": "The practice of capturing, organizing, and retrieving personal knowledge \u2014 transformed by LLMs from manual note-taking (Notion/Obsidian) to AI-compiled, queryable wikis with automatic synthesis and gap-filling.", "connections": 12}, {"id": "concepts/vector-databases", "title": "Vector Databases", "type": "concept", "summary": "Specialized databases for approximate nearest-neighbor (ANN) search over embedding vectors, necessary at billion-vector scale but often overkill for personal or team-scale LLM knowledge bases where pgvector, FAISS, or index-based LLM navigation suffice.", "connections": 8}, {"id": "concepts/cheap-ontology", "title": "Cheap Ontology", "type": "concept", "summary": "Pebblous framing: LLM wikis replace $10M\u2013$20M enterprise knowledge graphs using only markdown files, LLM APIs, and natural-language schema instructions \u2014 democratizing what was once exclusive ontology engineering expertise.", "connections": 10}, {"id": "concepts/knowledge-graph", "title": "Knowledge Graph", "type": "concept", "summary": "Formal representation of knowledge as nodes (entities) and edges (relationships), with three distinct modern approaches: KARMA (automated multi-agent enrichment), Graphiti (temporal context graphs), and Gallagher's Knowledge Graph Kit (personal SQLite graph).", "connections": 19}, {"id": "concepts/wiki-compilation", "title": "Wiki Compilation", "type": "concept", "summary": "The LLM-driven pipeline that converts raw ingested documents into a structured, cross-linked markdown wiki with source summaries and concept articles.", "connections": 17}, {"id": "concepts/second-brain", "title": "Second Brain", "type": "concept", "summary": "A personal AI system that stores, organizes, and retrieves the user's own knowledge \u2014 implemented either as a markdown wiki (Karpathy), a graph database (Gallagher), or a RAG pipeline (Decoding AI), all using LLMs as the intelligence layer.", "connections": 10}, {"id": "concepts/post-code-ai-workflow", "title": "Post-Code AI Workflow", "type": "concept", "summary": "Karpathy's framing of a shift in AI-augmented developer work: from code generation as the primary token use, to knowledge compilation and orchestration \u2014 'manipulating knowledge, not code.", "connections": 6}, {"id": "concepts/llm-qa-over-documents", "title": "LLM Q&A Over Documents", "type": "concept", "summary": "Using an LLM agent to answer complex questions over a compiled wiki by reading index files and summaries to navigate to relevant full articles, without needing a vector database.", "connections": 9}, {"id": "concepts/llm-knowledge-base", "title": "LLM Knowledge Base", "type": "concept", "summary": "A personal knowledge base where an LLM authors and maintains all wiki content from raw ingested sources, with humans interacting only via natural language.", "connections": 36}, {"id": "concepts/automated-wiki-creation", "title": "Automated Wiki Creation", "type": "concept", "summary": "STORM's approach: single-shot, multi-perspective Wikipedia-style article generation from web search using simulated expert conversations and outline-first synthesis \u2014 contrasting with Karpathy's incremental, accumulating KB model.", "connections": 7}, {"id": "concepts/markdown-as-universal-interface", "title": "Markdown as Universal Interface", "type": "concept", "summary": "The observation that markdown is simultaneously human-readable, LLM-friendly, version-controllable, tool-agnostic, and future-proof \u2014 making it the optimal substrate for LLM-maintained knowledge bases.", "connections": 10}, {"id": "concepts/knowledge-base-product-gap", "title": "Knowledge Base Product Gap", "type": "concept", "summary": "Karpathy's own acknowledgment that the current LLM-KB is 'a hacky collection of scripts' \u2014 and the product opportunity to build polished tooling that makes AI-maintained wikis accessible to non-technical users.", "connections": 10}, {"id": "sources/antigravity-post-code-ai-workflow", "title": "Source: Karpathy's LLM Knowledge Bases: The Post-Code AI Workflow", "type": "source-summary", "summary": "Broadest analysis of Karpathy's LLM KB shift: the 6-step workflow, developer role transformation, real-world applications across 7 domains, hallucination contamination risk, and minimum viable setup.", "connections": 15}, {"id": "sources/karma-multi-agent-knowledge-graph", "title": "Source: KARMA \u2014 Multi-Agent LLM Framework for Knowledge Graph Enrichment", "type": "source-summary", "summary": "NeurIPS 2025 Spotlight paper: nine-agent LLM framework for automated KG enrichment achieving 83.1% accuracy on 1,200 PubMed articles with 18.6% conflict reduction \u2014 the research-grade counterpart to markdown wikis.", "connections": 7}, {"id": "sources/dairai-llm-knowledge-bases-architecture", "title": "Source: LLM Knowledge Bases: A System Architecture Overview", "type": "source-summary", "summary": "DAIR.AI Academy deep-dive on the four-phase operational cycle (ingest, compile, query, maintain) of Karpathy's LLM knowledge base system, emphasizing no vector infrastructure needed at personal scale.", "connections": 8}, {"id": "sources/karpathy-llm-knowledge-bases", "title": "Source: Thread by @karpathy \u2014 LLM Knowledge Bases", "type": "source-summary", "summary": "Karpathy describes using LLMs to build and maintain personal markdown wikis from raw ingested sources, with Obsidian as the viewing IDE and LLM-driven Q&A, output generation, and linting.", "connections": 18}, {"id": "sources/storm-automated-wiki-creation", "title": "Source: STORM \u2014 Automating Wikipedia Article Creation with LLMs", "type": "source-summary", "summary": "STORM system: multi-perspective question-asking + retrieval \u2192 automated Wikipedia-style article generation with FreshWiki evaluation dataset, contrasting single-shot creation vs. Karpathy's accumulating KB.", "connections": 7}, {"id": "sources/graphiti-temporal-knowledge-graphs", "title": "Source: Graphiti \u2014 Temporal Context Graphs for AI Agents", "type": "source-summary", "summary": "Graphiti: open-source temporal graph framework for AI agents with time-windowed facts, incremental updates, hybrid retrieval (semantic + BM25 + graph), and full provenance \u2014 the middle ground between markdown wikis and enterprise KGs.", "connections": 8}, {"id": "sources/pebblous-cheap-ontology", "title": "Source: LLMs That Compile Knowledge: The Karpathy Methodology and the Democratization of Ontology", "type": "source-summary", "summary": "Deep analysis placing Karpathy's markdown wiki within 50 years of ontology history, quantifying the RAG vs. fine-tuning vs. LLM-KB tradeoffs, and identifying data quality as the decisive bottleneck.", "connections": 13}, {"id": "sources/decodingai-second-brain-rag", "title": "Source: Build Your Second Brain AI Assistant \u2014 LLMs and RAG", "type": "source-summary", "summary": "Production-grade second brain using the FTI (Feature/Training/Inference) architecture: Notion \u2192 ETL \u2192 MongoDB vector search + Llama 3.1 fine-tuning + ZenML orchestration \u2014 the enterprise-scale counterpart to Karpathy's personal approach.", "connections": 8}, {"id": "sources/glenrhodes-karpathy-workflow", "title": "Source: Andrej Karpathy's LLM-Powered Knowledge Base Workflow", "type": "source-summary", "summary": "Technical walkthrough of Karpathy's workflow emphasizing the 'filing loop' where query results compound the knowledge base, and the product gap for non-technical users.", "connections": 10}, {"id": "sources/hn-vector-database-debate", "title": "Source: Do You Need a Vector Database? (HN Discussion)", "type": "source-summary", "summary": "Hacker News practitioner debate: pgvector and Elasticsearch handle most cases; specialized vector DBs only justified at billion-vector scale; FAISS/Vespa.ai as middle ground; real question is 'do you need ANN search?", "connections": 4}, {"id": "sources/gallagher-second-brain-knowledge-graphs", "title": "Source: Using LLMs as a Second Brain \u2014 From Notes to Knowledge Graphs", "type": "source-summary", "summary": "Practitioner account of building the Knowledge Graph Kit (MCP server): SQLite + ChromaDB graph with four node types, contrasting structure-first (graph) vs. text-first (markdown) approaches to personal knowledge management.", "connections": 9}, {"id": "entities/karma", "title": "KARMA", "type": "entity", "summary": "A NeurIPS 2025 Spotlight paper presenting a nine-agent LLM framework for automated knowledge graph enrichment from unstructured scientific text.", "connections": 3}, {"id": "entities/storm", "title": "STORM", "type": "entity", "summary": "A research system for automated Wikipedia-style article creation using multi-perspective question-asking and retrieval-based outline synthesis.", "connections": 2}, {"id": "entities/marp", "title": "Marp", "type": "entity", "summary": "A markdown-based presentation framework used within Obsidian to render LLM-generated slide decks as one of the multi-format output options in the knowledge base workflow.", "connections": 5}, {"id": "entities/obsidian", "title": "Obsidian", "type": "entity", "summary": "A markdown-based knowledge management application used as the read-only frontend IDE for LLM-maintained wikis in Karpathy's workflow.", "connections": 8}, {"id": "entities/graphiti", "title": "Graphiti", "type": "entity", "summary": "An open-source framework by Zep for building temporal context graphs where facts have validity windows, designed for AI agents operating in dynamic environments.", "connections": 2}, {"id": "entities/andrej-karpathy", "title": "Andrej Karpathy", "type": "entity", "summary": "AI researcher and former Tesla/OpenAI lead who pioneered the LLM-maintained personal knowledge base workflow using markdown wikis and Obsidian.", "connections": 10}], "links": [{"source": "Dashboard", "target": "concepts/data-quality-bottleneck"}, {"source": "Dashboard", "target": "concepts/multi-agent-systems"}, {"source": "Dashboard", "target": "concepts/wiki-compilation"}, {"source": "Dashboard", "target": "Queries"}, {"source": "Dashboard", "target": "concepts/obsidian-as-ide"}, {"source": "Dashboard", "target": "concepts/rag-vs-index-based-retrieval"}, {"source": "Dashboard", "target": "sources/karpathy-llm-knowledge-bases"}, {"source": "Dashboard", "target": "concepts/llm-knowledge-base"}, {"source": "Dashboard", "target": "concepts/linting-and-health-checks"}, {"source": "Dashboard", "target": "Graph"}, {"source": "Dashboard", "target": "Tags"}, {"source": "Dashboard", "target": "concepts/hallucination-contamination"}, {"source": "Dashboard", "target": "concepts/knowledge-graph"}, {"source": "Dashboard", "target": "concepts/personal-knowledge-management"}, {"source": "Graph", "target": "sources/glenrhodes-karpathy-workflow"}, {"source": "Graph", "target": "sources/dairai-llm-knowledge-bases-architecture"}, const width = window.innerWidth, height = window.innerHeight;

const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);
const g = svg.append("g");

const zoom = d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);

const sim = d3.forceSimulation(graph.nodes)
  .force("link", d3.forceLink(graph.links).id(d => d.id).distance(100))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => nodeRadius(d) + 4));

function nodeRadius(d) { return Math.max(6, Math.min(24, 4 + d.connections * 1.5)); }

const link = g.append("g").selectAll("line")
  .data(graph.links).join("line")
  .attr("class", "link").attr("stroke", "#555").attr("stroke-width", 1);

const node = g.append("g").selectAll("g")
  .data(graph.nodes).join("g").attr("class", "node");

node.append("circle")
  .attr("r", d => nodeRadius(d))
  .attr("fill", d => COLORS[d.type] || "#999")
  .on("mouseover", showTooltip).on("mouseout", hideTooltip)
  .call(d3.drag().on("start", dragStart).on("drag", dragging).on("end", dragEnd));

node.append("text").attr("dx", d => nodeRadius(d) + 4).attr("dy", 4)
  .text(d => d.title.length > 30 ? d.title.slice(0, 28) + "..." : d.title);

sim.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

function showTooltip(e, d) {
  const tt = document.getElementById("tooltip");
  const color = COLORS[d.type] || "#999";
  tt.innerHTML = `<h3>${d.title}</h3><span class="type-badge" style="background:${color}">${d.type}</span><br><br>${d.summary || "No summary."}<br><br><small>${d.connections} connections</small>`;
  tt.style.display = "block";
  tt.style.left = (e.pageX + 16) + "px";
  tt.style.top = (e.pageY - 10) + "px";
}
function hideTooltip() { document.getElementById("tooltip").style.display = "none"; }

function dragStart(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragging(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }

// Search
document.getElementById("search").addEventListener("input", function() {
  const q = this.value.toLowerCase();
  node.style("opacity", d => (!q || d.title.toLowerCase().includes(q) || d.id.toLowerCase().includes(q)) ? 1 : 0.1);
  link.style("opacity", d => {
    if (!q) return 1;
    const sMatch = d.source.title.toLowerCase().includes(q) || d.source.id.toLowerCase().includes(q);
    const tMatch = d.target.title.toLowerCase().includes(q) || d.target.id.toLowerCase().includes(q);
    return (sMatch || tMatch) ? 0.6 : 0.05;
  });
});

// Filter
let activeType = "all";
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    activeType = this.dataset.type;
    node.style("opacity", d => (activeType === "all" || d.type === activeType) ? 1 : 0.08);
    link.style("opacity", d => {
      if (activeType === "all") return 1;
      return (d.source.type === activeType || d.target.type === activeType) ? 0.5 : 0.03;
    });
  });
});
</script>
