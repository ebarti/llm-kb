[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kb"
version = "0.1.0"
description = "LLM-powered personal knowledge base CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
]

[project.scripts]
kb = "tools.kb.cli:main"

[tool.setuptools.packages.find]
include = ["tools*"]
namespaces = true
